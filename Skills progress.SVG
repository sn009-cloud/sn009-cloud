<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="270" rx="16" fill="url(#bg)"/>
  <text x="400" y="32" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="16" fill="#00f7ff">Learning Progress</text>

  <g font-family="Fira Code, Consolas, monospace" font-size="13" fill="#ffffff">
    <text x="40" y="76">JavaScript</text>
    <text x="40" y="116">Python</text>
    <text x="40" y="156">Data Science</text>
    <text x="40" y="196">Machine Learning</text>
    <text x="40" y="236">Deep Learning</text>
  </g>

  <!-- bar tracks -->
  <g fill="#ffffff" fill-opacity="0.12">
    <rect x="210" y="62" width="480" height="18" rx="9"/>
    <rect x="210" y="102" width="480" height="18" rx="9"/>
    <rect x="210" y="142" width="480" height="18" rx="9"/>
    <rect x="210" y="182" width="480" height="18" rx="9"/>
    <rect x="210" y="222" width="480" height="18" rx="9"/>
  </g>

  <!-- animated bars (loop) -->
  <g fill="url(#bar)">
    <rect x="210" y="62" height="18" rx="9" width="0">
      <animate attributeName="width" values="0;360;360;0" keyTimes="0;0.25;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="210" y="102" height="18" rx="9" width="0">
      <animate attributeName="width" values="0;336;336;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="210" y="142" height="18" rx="9" width="0">
      <animate attributeName="width" values="0;264;264;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="210" y="182" height="18" rx="9" width="0">
      <animate attributeName="width" values="0;240;240;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="210" y="222" height="18" rx="9" width="0">
      <animate attributeName="width" values="0;144;144;0" keyTimes="0;0.25;0.9;1" dur="7s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Fira Code, Consolas, monospace" font-size="13" fill="#9ad9e6">
    <text x="705" y="76">75%</text>
    <text x="705" y="116">70%</text>
    <text x="705" y="156">55%</text>
    <text x="705" y="196">50%</text>
    <text x="705" y="236">30%</text>
  </g>
</svg>
