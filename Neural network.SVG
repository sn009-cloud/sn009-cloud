<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </radialGradient>
  </defs>

  <rect width="800" height="230" rx="16" fill="url(#bg)"/>
  <text x="400" y="26" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#00f7ff">Neural Network | learning in progress...</text>

  <!-- connections: input -> hidden 1 -->
  <g stroke="#00f7ff" stroke-opacity="0.18" stroke-width="1">
    <line x1="130" y1="65" x2="300" y2="45"/><line x1="130" y1="65" x2="300" y2="95"/><line x1="130" y1="65" x2="300" y2="145"/><line x1="130" y1="65" x2="300" y2="195"/>
    <line x1="130" y1="120" x2="300" y2="45"/><line x1="130" y1="120" x2="300" y2="95"/><line x1="130" y1="120" x2="300" y2="145"/><line x1="130" y1="120" x2="300" y2="195"/>
    <line x1="130" y1="175" x2="300" y2="45"/><line x1="130" y1="175" x2="300" y2="95"/><line x1="130" y1="175" x2="300" y2="145"/><line x1="130" y1="175" x2="300" y2="195"/>
    <!-- hidden 1 -> hidden 2 -->
    <line x1="300" y1="45" x2="500" y2="45"/><line x1="300" y1="45" x2="500" y2="95"/><line x1="300" y1="45" x2="500" y2="145"/><line x1="300" y1="45" x2="500" y2="195"/>
    <line x1="300" y1="95" x2="500" y2="45"/><line x1="300" y1="95" x2="500" y2="95"/><line x1="300" y1="95" x2="500" y2="145"/><line x1="300" y1="95" x2="500" y2="195"/>
    <line x1="300" y1="145" x2="500" y2="45"/><line x1="300" y1="145" x2="500" y2="95"/><line x1="300" y1="145" x2="500" y2="145"/><line x1="300" y1="145" x2="500" y2="195"/>
    <line x1="300" y1="195" x2="500" y2="45"/><line x1="300" y1="195" x2="500" y2="95"/><line x1="300" y1="195" x2="500" y2="145"/><line x1="300" y1="195" x2="500" y2="195"/>
    <!-- hidden 2 -> output -->
    <line x1="500" y1="45" x2="670" y2="90"/><line x1="500" y1="45" x2="670" y2="150"/>
    <line x1="500" y1="95" x2="670" y2="90"/><line x1="500" y1="95" x2="670" y2="150"/>
    <line x1="500" y1="145" x2="670" y2="90"/><line x1="500" y1="145" x2="670" y2="150"/>
    <line x1="500" y1="195" x2="670" y2="90"/><line x1="500" y1="195" x2="670" y2="150"/>
  </g>

  <!-- moving signals -->
  <g fill="#ffffff">
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" begin="0s" path="M130,65 L300,95 L500,145 L670,90"/></circle>
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" begin="0.7s" path="M130,120 L300,45 L500,95 L670,150"/></circle>
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" begin="1.4s" path="M130,175 L300,145 L500,45 L670,90"/></circle>
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" begin="2.1s" path="M130,120 L300,195 L500,195 L670,150"/></circle>
  </g>

  <!-- nodes -->
  <g fill="url(#glow)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5">
    <circle cx="130" cy="65" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="130" cy="120" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="130" cy="175" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="0.6s"/></circle>

    <circle cx="300" cy="45" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="300" cy="95" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="300" cy="145" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="300" cy="195" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="1.6s"/></circle>

    <circle cx="500" cy="45" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="500" cy="95" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="1.3s"/></circle>
    <circle cx="500" cy="145" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="1.7s"/></circle>
    <circle cx="500" cy="195" r="10"><animate attributeName="r" values="9;13;9" dur="2s" repeatCount="indefinite" begin="0.2s"/></circle>

    <circle cx="670" cy="90" r="12" fill="#f97316"><animate attributeName="r" values="11;16;11" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="150" r="12" fill="#22c55e"><animate attributeName="r" values="11;16;11" dur="1.5s" repeatCount="indefinite" begin="0.7s"/></circle>
  </g>

  <g font-family="Fira Code, Consolas, monospace" font-size="11" fill="#9ad9e6" text-anchor="middle">
    <text x="130" y="222">Data</text>
    <text x="300" y="222">Learn</text>
    <text x="500" y="222">Train</text>
    <text x="670" y="222">Predict</text>
  </g>
</svg>
